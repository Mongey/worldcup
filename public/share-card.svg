<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">World Cup 2026 Sweepstakes</title>
  <desc id="desc">A red, white, and blue social sharing card for the World Cup 2026 Sweepstakes.</desc>
  <defs>
    <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse">
      <polygon points="32,10 37,25 53,25 40,34 45,50 32,40 19,50 24,34 11,25 27,25" fill="#ffffff" opacity="0.92" />
    </pattern>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e8" />
      <stop offset="1" stop-color="#f1e4bf" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#3c3b6e" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)" />

  <g opacity="0.14">
    <rect y="0" width="1200" height="36" fill="#b22234" />
    <rect y="72" width="1200" height="36" fill="#b22234" />
    <rect y="144" width="1200" height="36" fill="#b22234" />
    <rect y="216" width="1200" height="36" fill="#b22234" />
    <rect y="288" width="1200" height="36" fill="#b22234" />
    <rect y="360" width="1200" height="36" fill="#b22234" />
    <rect y="432" width="1200" height="36" fill="#b22234" />
    <rect y="504" width="1200" height="36" fill="#b22234" />
    <rect y="576" width="1200" height="36" fill="#b22234" />
  </g>

  <rect x="0" y="0" width="362" height="630" fill="#3c3b6e" />
  <rect x="0" y="0" width="362" height="630" fill="url(#stars)" opacity="0.95" />
  <rect x="26" y="26" width="1148" height="578" fill="none" stroke="#b22234" stroke-width="12" />
  <rect x="46" y="46" width="1108" height="538" fill="none" stroke="#3c3b6e" stroke-width="4" opacity="0.8" />

  <g transform="translate(400 92)">
    <text x="0" y="0" fill="#3c3b6e" font-family="Impact, Arial Black, sans-serif" font-size="42" dominant-baseline="hanging">USA / CAN / MEX</text>
    <text x="0" y="90" fill="#3c3b6e" font-family="Impact, Arial Black, sans-serif" font-size="84" dominant-baseline="hanging" filter="url(#shadow)">WORLD CUP</text>
    <text x="0" y="205" fill="#b22234" font-family="Impact, Arial Black, sans-serif" font-size="150" dominant-baseline="hanging" filter="url(#shadow)">2026</text>
    <rect x="0" y="388" width="560" height="70" fill="#b22234" />
    <text x="280" y="408" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="46" text-anchor="middle" dominant-baseline="hanging">SWEEPSTAKES</text>
  </g>

  <g transform="translate(1020 92)">
    <rect x="-22" y="-22" width="148" height="218" rx="14" fill="#ffffff" stroke="#b22234" stroke-width="7" />
    <image href="assets/wc2026-logo.png" x="0" y="0" width="104" height="156" preserveAspectRatio="xMidYMid meet" />
    <rect x="-8" y="164" width="120" height="32" fill="#3c3b6e" />
    <text x="52" y="173" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="hanging">MONGEY.NET</text>
  </g>
</svg>
